[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt"
version = "0.1.0"
description = "Starter Python project scaffold"
readme = "README.md"
authors = [{ name = "Chatgpt Maintainers" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chatgpt = "chatgpt.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
